<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botones en Bootstrap 5</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h1 class="mb-4">Ejemplos de Botones con Bootstrap 5</h1>

        <!-- Botones Sólidos -->
        <section class="mb-4">
            <h3>Botones Estándar (Sólidos)</h3>
            <button type="button" class="btn btn-primary">Primary</button>
            <button type="button" class="btn btn-secondary">Secondary</button>
            <button type="button" class="btn btn-success">Success</button>
            <button type="button" class="btn btn-danger">Danger</button>
            <button type="button" class="btn btn-warning">Warning</button>
            <button type="button" class="btn btn-info">Info</button>
            <button type="button" class="btn btn-light">Light</button>
            <button type="button" class="btn btn-dark">Dark</button>
            <button type="button" class="btn btn-link">Link</button>
        </section>

        <hr>

        <!-- Botones con Borde (Outline) -->
        <section class="mb-4">
            <h3>Botones Outline (Solo Borde)</h3>
            <button type="button" class="btn btn-outline-primary">Primary</button>
            <button type="button" class="btn btn-outline-secondary">Secondary</button>
            <button type="button" class="btn btn-outline-success">Success</button>
            <button type="button" class="btn btn-outline-danger">Danger</button>
            <button type="button" class="btn btn-outline-warning">Warning</button>
            <button type="button" class="btn btn-outline-info">Info</button>
            <button type="button" class="btn btn-outline-dark">Dark</button>
        </section>

        <hr>

        <!-- Tamaños de Botones -->
        <section class="mb-4">
            <h3>Tamaños</h3>
            <button type="button" class="btn btn-primary btn-lg">Boton Grande (btn-lg)</button>
            <button type="button" class="btn btn-primary">Boton Normal</button>
            <button type="button" class="btn btn-primary btn-sm">Boton Pequeño (btn-sm)</button>
        </section>

        <hr>

        <!-- Estados y Ancho Completo -->
        <section class="mb-4">
            <h3>Estados y Bloque</h3>
            <button type="button" class="btn btn-primary" disabled>Deshabilitado</button>
            <div class="d-grid gap-2 mt-3">
                <button class="btn btn-success" type="button">Botón de Ancho Completo (d-grid)</button>
            </div>
        </section>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

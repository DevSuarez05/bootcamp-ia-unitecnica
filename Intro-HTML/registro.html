<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!--Indica la codificación de caracteres a utlizar - Universal-->  
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <!--Permiten al usuario o navegador establecer el modo vista de compatibilidad-->
  
  <link rel="stylesheet" href="estilos.css">
  <!--Vincula la hoja de estilos a utilizar-->

  <title>Formulario Registro</title>
</head>

<body>
  <form action="empresa@email.com" method="post" enctype="text/plain">
  <section class="formulario">
    <h4>Formulario Registro</h4>
    <input class="entrada" type="text" name="nombres" id="nombres" placeholder="Ingrese su Nombre" required>
    <input class="entrada" type="text" name="apellidos" id="apellidos" placeholder="Ingrese su Apellido">
    <input class="entrada" type="email" name="correo" id="correo" placeholder="Ingrese su Correo">
    <input class="entrada" type="password" name="password" id="password" placeholder="Ingrese su Contraseña">
    <p>Estoy de acuerdo con <a href="#">Terminos y Condiciones</a></p>
    <input class="boton" type="submit" value="Registrar">    
    <input class="boton" type="reset" value="Limpiar Datos">
    <p><a href="#">¿Ya tengo Cuenta?</a></p>    
  </section>
  </form>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edad y Peso</title>
</head>
<body>
    <script>
        let edad;
        let peso;
        edad = prompt("Ingrese su edad:");
        peso = prompt("Ingrese su peso:");
        document.write("Su Edad es: ", edad, "<br>" );
        document.write("Su Peso es: " , peso, "<br>" );
        let libras;
        libras = peso * 2.20462;
        document.write("Su Peso en libras es: " , libras, "<br>" );
    </script>
</body>
</html>

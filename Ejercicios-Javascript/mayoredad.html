<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mayor Edad</title>
</head>
<body>
    <script>
        let edad;
        edad = prompt("Ingrese su edad:");
        if (edad >= 18) {
            document.write("Usted es mayor de edad.");
        } 
        else {
            document.write("Usted es menor de edad.");
        }
    </script>
</body>
</html>
